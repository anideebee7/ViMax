# Create from .env (do not commit real values):
#
#   kubectl create secret generic vimax-api-secret --namespace=vimax --from-env-file=.env
#
# Or from literals:
#   kubectl create secret generic vimax-api-secret --namespace=vimax \
#     --literal=XAI_API_KEY=xxx \
#     --literal=GEMINI_API_KEY=xxx \
#     --literal=AWS_ACCESS_KEY_ID=xxx \
#     --literal=AWS_SECRET_ACCESS_KEY=xxx
#
# See .env.example for all keys (PIAPI, ElevenLabs, S3, etc.).
