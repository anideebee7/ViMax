apiVersion: apps/v1
kind: Deployment
metadata:
  name: vimax-frontend
  namespace: vimax
  labels:
    app: vimax-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vimax-frontend
  template:
    metadata:
      labels:
        app: vimax-frontend
    spec:
      containers:
        - name: frontend
          # Replace with your ECR URL
          image: 000000000000.dkr.ecr.us-east-1.amazonaws.com/vimax-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
