# Idea to Documentary Pipeline Configuration

chat_model:
  init_args:
    model: gemini-2.0-flash
    model_provider: google_genai
    api_key: ${GEMINI_API_KEY}
  max_requests_per_minute: 200

# Optional image generator for B-roll stills
image_generator:
  class_path: tools.PiAPIImageGenerator
  init_args:
    api_key: ${PIAPI_API_KEY}
    model: ${PIAPI_IMAGE_MODEL}
  max_requests_per_minute: 20

# Optional video generator for segments
video_generator:
  class_path: tools.PiAPIVideoGenerator
  init_args:
    api_key: ${PIAPI_API_KEY}
    model: ${PIAPI_VIDEO_MODEL}
  max_requests_per_minute: 10

# Trend analyzer for trendy documentaries
trend_analyzer:
  google_trends:
    enabled: true
  youtube_trends:
    enabled: true
    api_key: ${YOUTUBE_API_KEY}
  reddit:
    enabled: true
    subreddits:
      - Documentaries
      - TrueFilm
      - history
  newsapi:
    enabled: true
    api_key: ${NEWSAPI_KEY}

working_dir: .working_dir/documentary
force_regenerate: false
